<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="Jogos online grátis para crianças. Sem download, é só clicar e jogar." />
    <title>ML Tech Games</title>
    <link rel="stylesheet" href="/css/site.css" />
    <script type="module" src="/js/topo.js"></script>
    <script type="module">
        import { JOGOS } from "/js/jogos.js";
        import { aoMudarConta, lerProgresso } from "/js/conta.js";

        const lista = document.getElementById("lista-jogos");

        function desenhar() {
            lista.innerHTML = JOGOS.map((jogo) => {
                const { recorde } = lerProgresso(jogo.id);
                return `<a class="cartao" href="${jogo.caminho}" style="--cor: ${jogo.cor}">
                    <h3>${jogo.nome}</h3>
                    <p>${jogo.frase}</p>
                    ${recorde ? `<p class="cartao-recorde">Seu recorde: ${recorde}</p>` : ""}
                    <span class="botao">Jogar</span>
                </a>`;
            }).join("");
        }

        aoMudarConta(desenhar);
    </script>
</head>

<body>
    <main>
        <section class="abertura">
            <h1>Escolha um jogo e divirta-se!</h1>
            <p>É só clicar e jogar. Não precisa baixar nada.</p>
        </section>

        <section aria-label="Jogos">
            <div id="lista-jogos" class="grade"></div>
        </section>

        <section class="adultos">
            <h2>Para os adultos</h2>
            <p>Cada jogo aqui esconde um pouco de conhecimento dentro da própria brincadeira. A criança joga porque é divertido e pratica sem perceber.</p>
        </section>
    </main>
</body>

</html>
